<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Windows font names map to look-alike open fonts, and Selawik is the default UI font. -->
<fontconfig>
  <alias binding="same"><family>Segoe UI</family><accept><family>Selawik</family></accept></alias>
  <alias binding="same"><family>Segoe UI Variable</family><accept><family>Selawik</family></accept></alias>
  <alias binding="same"><family>Segoe UI Variable Text</family><accept><family>Selawik</family></accept></alias>
  <alias binding="same"><family>Segoe UI Variable Display</family><accept><family>Selawik</family></accept></alias>
  <alias binding="same"><family>Tahoma</family><accept><family>Selawik</family></accept></alias>
  <alias binding="same"><family>Consolas</family><accept><family>Cascadia Mono</family></accept></alias>
  <alias binding="same"><family>Lucida Console</family><accept><family>Cascadia Mono</family></accept></alias>
  <alias binding="same"><family>Segoe UI Emoji</family><accept><family>Noto Color Emoji</family></accept></alias>
  <alias><family>sans-serif</family><prefer><family>Selawik</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Cascadia Mono</family></prefer></alias>
</fontconfig>
